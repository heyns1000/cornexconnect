name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: Run tests and linting
  quality-checks:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      env:
        CI: true
    
    - name: Run TypeScript type checking
      run: npm run check
      continue-on-error: false
    
    - name: Check for ESLint issues
      run: npm run lint --if-present
      continue-on-error: true
    
    - name: Run tests
      run: npm test --if-present
      continue-on-error: true
    
    - name: Build project
      run: npm run build
      env:
        NODE_ENV: production

  # Job 2: Security scan
  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true
    
    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      continue-on-error: true

  # Job 3: Deploy to Vercel (frontend)
  deploy-frontend:
    needs: quality-checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Vercel
      uses: vercel/action@master
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL_PROD }}

  # Job 4: Deploy to Railway (backend)
  deploy-backend:
    needs: quality-checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Railway
      uses: railway-app/cli-action@v1
      with:
        token: ${{ secrets.RAILWAY_TOKEN }}
      env:
        RAILWAY_SERVICE: cornexconnect-backend

  # Job 5: Post-deployment notifications
  notify:
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          CornexConnect Deployment Status
          Frontend: ${{ needs.deploy-frontend.result }}
          Backend: ${{ needs.deploy-backend.result }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always()
    
    - name: Create deployment badge
      run: |
        echo "Deployment completed at $(date)" > deployment.log
        echo "Commit: ${{ github.sha }}" >> deployment.log
        echo "Branch: ${{ github.ref }}" >> deployment.log
